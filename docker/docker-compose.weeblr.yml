x-api-build: &api-build
  context: ..
  args:
    WEEBLR_NODE_VERSION: ${WEEBLR_NODE_VERSION:-24}
  # Upstream's Dockerfile only has a dev stage relying on a bind mount of the repo,
  # so the production image is built here, keeping all our changes in this one file.
  # Upstream code does not pass its own strict type check (it runs with
  # ts-node-dev --transpile-only), so tsc errors are logged but only missing output fails.
  dockerfile_inline: |
    ARG WEEBLR_NODE_VERSION=24
    FROM node:$${WEEBLR_NODE_VERSION}-trixie-slim
    RUN apt-get update \
      && apt-get install -y --no-install-recommends openssl ca-certificates \
      && rm -rf /var/lib/apt/lists/*
    RUN corepack enable && corepack prepare pnpm@8.15.0 --activate
    WORKDIR /app
    COPY package.json pnpm-lock.yaml pnpm-workspace.yaml tsconfig.base.json ./
    COPY packages/api/package.json ./packages/api/
    RUN pnpm install --frozen-lockfile --filter @formgrid/api
    COPY packages/api ./packages/api
    WORKDIR /app/packages/api
    RUN pnpm exec prisma generate
    RUN pnpm run build || true
    RUN test -f dist/server.js && test -f dist/queueWorker.js
    ENV NODE_ENV=production
    EXPOSE 4000
    CMD ["node", "dist/server.js"]

x-frontend-build: &frontend-build
  context: ..
  args:
    WEEBLR_NODE_VERSION: ${WEEBLR_NODE_VERSION:-24}
    WEEBLR_NGINX_VERSION: ${WEEBLR_NGINX_VERSION:-1.31.8}
    VITE_API_BASE_URL: ${APP_URL}
    VITE_ENABLE_ACCOUNTS: ${ENABLE_ACCOUNTS:-false}
  # Upstream's Dockerfile only runs the Vite dev server. The backend CORS list is
  # hardcoded to localhost, so the dashboard and /api are served from the same origin.
  # Rate limit (nginx only): 5 per minute per IP, IPv6 grouped by /64, burst 5, on POST to
  # login, password reset and the public submission routes; 429 when exceeded, logged.
  # Security headers (CSP, framing, nosniff, referrer) on the dashboard locations only: the
  # pages under /api/ set their own CSP, which a second policy would combine with and break.
  dockerfile_inline: |
    # syntax=docker/dockerfile:1
    ARG WEEBLR_NODE_VERSION=24
    ARG WEEBLR_NGINX_VERSION=1.31.8
    FROM node:$${WEEBLR_NODE_VERSION}-trixie-slim AS builder
    RUN corepack enable && corepack prepare pnpm@8.15.0 --activate
    WORKDIR /app
    COPY package.json pnpm-lock.yaml pnpm-workspace.yaml ./
    COPY apps/dashboard/package.json ./apps/dashboard/
    RUN pnpm install --frozen-lockfile --filter @formgrid/dashboard
    COPY apps/dashboard ./apps/dashboard
    WORKDIR /app/apps/dashboard
    ARG VITE_API_BASE_URL
    ARG VITE_ENABLE_ACCOUNTS
    RUN test -n "$${VITE_API_BASE_URL}" && pnpm run build

    FROM nginx:$${WEEBLR_NGINX_VERSION}-trixie
    COPY <<'EOF' /etc/nginx/templates/default.conf.template
    map_hash_bucket_size 256;

    map $$http_wbl_origin_auth $$wbl_origin_ok {
        default 0;
        "$${WBL_ORIGIN_AUTH}" 1;
    }

    map "$${WBL_ENABLE_ACCOUNTS}" $$wbl_accounts_enabled {
        default 0;
        "true" 1;
    }

    map $$remote_addr $$wbl_limit_ip {
        "~^(?<prefix>[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}):" $$prefix;
        default $$remote_addr;
    }

    map "$$request_method $$uri" $$wbl_limit_key {
        "~*^POST /api/(auth/(login|forgot-password|reset-password)|f/[^/]+|api/f/[^/]+|forms/[^/]+/submit)/?$$" $$wbl_limit_ip;
        default "";
    }

    limit_req_zone $$wbl_limit_key zone=wbl_public:10m rate=5r/m;

    server {
        listen 80;
        root /usr/share/nginx/html;
        client_max_body_size 12m;
        server_tokens off;

        if ($$wbl_origin_ok = 0) {
            return 403;
        }

        set_real_ip_from 10.0.0.0/8;
        set_real_ip_from 172.16.0.0/12;
        set_real_ip_from 192.168.0.0/16;
        real_ip_header CF-Connecting-IP;

        location /api/ {
            limit_req zone=wbl_public burst=5 nodelay;
            limit_req_status 429;
            limit_req_log_level warn;
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $$backend_upstream http://backend:4000;
            proxy_pass $$backend_upstream;
            proxy_set_header Host $$host;
            proxy_set_header X-Real-IP $$remote_addr;
            proxy_set_header X-Forwarded-For $$remote_addr;
            proxy_set_header X-Forwarded-Proto $$scheme;
            proxy_set_header wbl-origin-auth "";
        }

        location /uploads/ {
            alias /srv/uploads/;
            add_header X-Content-Type-Options nosniff always;
            add_header Content-Security-Policy "sandbox" always;
        }

        location ~ ^/(signup|dashboard/settings)/?$$ {
            include /etc/nginx/wbl-dashboard-headers.conf;
            if ($$wbl_accounts_enabled = 0) {
                return 403;
            }
            try_files /index.html =404;
        }

        location / {
            include /etc/nginx/wbl-dashboard-headers.conf;
            try_files $$uri $$uri/ /index.html;
        }
    }
    EOF
    COPY <<'EOF' /etc/nginx/wbl-dashboard-headers.conf
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    EOF
    COPY --from=builder /app/apps/dashboard/dist /usr/share/nginx/html

services:
  # MySQL Database
  db:
    # Upstream publishes 8.4 for Oracle Linux only. Upgrading from 8.0: see WEEBLR.md
    image: mysql:8.4
    container_name: formgrid-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ../packages/api/prisma/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Redis for Queue System
  redis:
    image: redis:7-alpine
    container_name: formgrid-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"]
    environment:
      # Used by redis-cli in the healthcheck
      - REDISCLI_AUTH=${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 10s
      retries: 5

  # Backend Service
  backend:
    build: *api-build
    container_name: formgrid-backend
    restart: unless-stopped
    volumes:
      - uploads_data:/app/uploads  # Local file storage
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=1d
      - EMAIL_PROVIDER=resend
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM}
      - APP_URL=${APP_URL}
      # File Storage Configuration
      - FILE_STORAGE_TYPE=local  # Options: local, s3, gcs, minio
      - UPLOAD_PATH=/app/uploads
      # Account creation and deletion, off unless set to true
      - ENABLE_ACCOUNTS=${ENABLE_ACCOUNTS:-false}
      # File uploads on public forms, off unless set to true; any file is then refused with 403
      - ENABLE_UPLOADS=${ENABLE_UPLOADS:-false}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Frontend Service
  frontend:
    build: *frontend-build
    container_name: formgrid-frontend
    restart: unless-stopped
    volumes:
      # Served by nginx under /uploads, the backend serves a different folder
      - uploads_data:/srv/uploads:ro
    environment:
      # Secret header added by a Cloudflare transform rule; requests without it get a 403
      - WBL_ORIGIN_AUTH=${WBL_ORIGIN_AUTH:?WBL_ORIGIN_AUTH must be set}
      - WBL_ENABLE_ACCOUNTS=${ENABLE_ACCOUNTS:-false}
      - NGINX_ENVSUBST_FILTER=^WBL_
    depends_on:
      - backend

  # Queue Worker Service
  queue-worker:
    build: *api-build
    container_name: formgrid-queue-worker
    restart: unless-stopped
    volumes:
      - uploads_data:/app/uploads
    environment:
      - NODE_ENV=production
      - DATABASE_URL=mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      # Not used by the worker, but required at startup by the shared configuration
      - JWT_SECRET=${JWT_SECRET}
      - EMAIL_PROVIDER=resend
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM}
      # File Storage Configuration
      - FILE_STORAGE_TYPE=local
      - UPLOAD_PATH=/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["node", "dist/queueWorker.js"]

volumes:
  mysql_data:
  redis_data:
  uploads_data:  # Local file storage
  
  
